<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f72585" />
      <stop offset="100%" stop-color="#7209b7" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9e00" />
      <stop offset="100%" stop-color="#ff5400" />
    </linearGradient>

    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2a4a" />
      <stop offset="100%" stop-color="#0b132b" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="circuitGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2d4d" stroke-width="0.8" opacity="0.4"/>
      <circle cx="40" cy="40" r="1.5" fill="#00f2fe" opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .pulse-orb {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8 16;
      animation: dash 12s linear infinite;
    }
    .flow-line-rev {
      stroke-dasharray: 6 12;
      animation: dashRev 10s linear infinite;
    }
    .chip-glow {
      animation: chipPulse 3s ease-in-out infinite alternate;
    }
    .pill-float {
      animation: float 5s ease-in-out infinite alternate;
    }
    .pill-float2 {
      animation: float 6s ease-in-out infinite alternate-reverse;
    }

    @keyframes pulse {
      0% { opacity: 0.25; transform: scale(0.95); }
      100% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -200; }
    }
    @keyframes dashRev {
      to { stroke-dashoffset: 200; }
    }
    @keyframes chipPulse {
      0% { filter: drop-shadow(0 0 4px rgba(0,242,254,0.3)); }
      100% { filter: drop-shadow(0 0 16px rgba(0,242,254,0.8)); }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="2"/>
  <rect width="1200" height="420" rx="16" fill="url(#circuitGrid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="150" cy="90" r="140" fill="#7209b7" opacity="0.3" filter="url(#glow)" class="pulse-orb" />
  <circle cx="1060" cy="330" r="160" fill="#00f2fe" opacity="0.25" filter="url(#glow)" class="pulse-orb" />
  <circle cx="980" cy="90" r="120" fill="#ff5400" opacity="0.2" filter="url(#glow)" class="pulse-orb" />

  <!-- Animated Circuit & Bus Traces (Strictly Background & Sides) -->
  <g opacity="0.7">
    <!-- Left PCB Traces -->
    <path d="M 0 120 L 140 120 L 190 170 L 190 280 L 130 340 L 0 340" fill="none" stroke="#00f2fe" stroke-width="2" class="flow-line" opacity="0.6"/>
    <path d="M 0 200 L 90 200 L 130 240 L 130 380 L 0 380" fill="none" stroke="#4facfe" stroke-width="1.5" class="flow-line-rev" opacity="0.5"/>
    <circle cx="190" cy="170" r="4" fill="#00f2fe" />
    <circle cx="130" cy="340" r="4" fill="#00f2fe" />

    <!-- Right Edge Traces & Microcontroller Silhouette -->
    <path d="M 1200 100 L 1050 100 L 1000 150 L 1000 270 L 1070 340 L 1200 340" fill="none" stroke="#f72585" stroke-width="2" class="flow-line" opacity="0.6"/>
    <path d="M 1200 220 L 1110 220 L 1060 270 L 1060 400" fill="none" stroke="#ff9e00" stroke-width="1.5" class="flow-line-rev" opacity="0.5"/>
    <circle cx="1000" cy="150" r="4" fill="#f72585" />
    <circle cx="1070" cy="340" r="4" fill="#f72585" />

    <!-- Stylized SBC Processor Core (Right Side) -->
    <g transform="translate(1010, 160)" class="chip-glow">
      <rect x="0" y="0" width="110" height="110" rx="10" fill="url(#chipGrad)" stroke="#00f2fe" stroke-width="2" />
      <rect x="18" y="18" width="74" height="74" rx="6" fill="#0d1b2a" stroke="#4facfe" stroke-width="1" />
      <text x="55" y="52" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">ARM64</text>
      <text x="55" y="70" fill="#a0aec0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" text-anchor="middle">RISC-V / SBC</text>
      <!-- Chip Pins -->
      <line x1="20" y1="-6" x2="20" y2="0" stroke="#00f2fe" stroke-width="2"/>
      <line x1="40" y1="-6" x2="40" y2="0" stroke="#00f2fe" stroke-width="2"/>
      <line x1="60" y1="-6" x2="60" y2="0" stroke="#00f2fe" stroke-width="2"/>
      <line x1="80" y1="-6" x2="80" y2="0" stroke="#00f2fe" stroke-width="2"/>
      <line x1="20" y1="110" x2="20" y2="116" stroke="#00f2fe" stroke-width="2"/>
      <line x1="40" y1="110" x2="40" y2="116" stroke="#00f2fe" stroke-width="2"/>
      <line x1="60" y1="110" x2="60" y2="116" stroke="#00f2fe" stroke-width="2"/>
      <line x1="80" y1="110" x2="80" y2="116" stroke="#00f2fe" stroke-width="2"/>
    </g>
  </g>

  <!-- Foreground Foreground: Title, Subtitle, and Tagline (Crystal Clear & Unobstructed) -->
  <g id="header-text">
    <!-- Top Category Badge -->
    <g transform="translate(140, 68)">
      <rect x="0" y="0" width="280" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="15" r="5" fill="#00f2fe"/>
      <text x="32" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">EMBEDDED LINUX &amp; SBC ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="140" y="148" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome Embedded Linux
    </text>
    <text x="140" y="200" fill="url(#cyanGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      &amp; Single-Board Computers
    </text>

    <!-- Subtitle / Tagline -->
    <text x="140" y="244" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500">
      Curated Build Systems, SBC Operating Systems, Dual A/B OTA Updaters &amp; Edge Fleet SaaS
    </text>
  </g>

  <!-- Interactive / Floating Tech Badges (Positioned cleanly below text) -->
  <g transform="translate(140, 290)">
    <!-- Pill 1: Yocto / Buildroot -->
    <g class="pill-float" transform="translate(0, 0)">
      <rect x="0" y="0" width="170" height="38" rx="19" fill="#111c33" stroke="#00f2fe" stroke-width="1.5" />
      <text x="85" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">⚡ Yocto &amp; Buildroot</text>
    </g>

    <!-- Pill 2: Single-Board Computers -->
    <g class="pill-float2" transform="translate(185, 0)">
      <rect x="0" y="0" width="180" height="38" rx="19" fill="#111c33" stroke="#f72585" stroke-width="1.5" />
      <text x="90" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">🖥️ Raspberry Pi &amp; Jetson</text>
    </g>

    <!-- Pill 3: Dual A/B OTA -->
    <g class="pill-float" transform="translate(380, 0)">
      <rect x="0" y="0" width="165" height="38" rx="19" fill="#111c33" stroke="#4facfe" stroke-width="1.5" />
      <text x="82" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">🔄 A/B OTA &amp; RAUC</text>
    </g>

    <!-- Pill 4: IoT Fleet SaaS -->
    <g class="pill-float2" transform="translate(560, 0)">
      <rect x="0" y="0" width="175" height="38" rx="19" fill="#111c33" stroke="#ff9e00" stroke-width="1.5" />
      <text x="87" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">☁️ Fleet SaaS &amp; Observability</text>
    </g>

    <!-- Pill 5: Open Source -->
    <g class="pill-float" transform="translate(750, 0)">
      <rect x="0" y="0" width="130" height="38" rx="19" fill="#111c33" stroke="#10b981" stroke-width="1.5" />
      <text x="65" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">🚀 Open-Source</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="140" y="360" width="920" height="2" fill="url(#cyanGrad)" opacity="0.4" />
</svg>
